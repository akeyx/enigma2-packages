name: Update OPKG Feed Index

on:
  push:
    paths:
      - '**/*.ipk'
  schedule:
    # Weekly index integrity check on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture folder (leave blank to re-index all)'
        required: false
        default: ''
      download_url:
        description: 'Optional URL of a remote .ipk file to download and index'
        required: false
        default: ''
  repository_dispatch:
    types: [update-feed, package-published]

permissions:
  contents: write

jobs:
  update-feed:
    name: Rebuild Packages & Packages.gz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Remote Package (if requested)
        if: ${{ github.event.inputs.download_url != '' }}
        run: |
          ARCH="${{ github.event.inputs.arch }}"
          if [ -z "$ARCH" ]; then
            ARCH="all"
          fi
          URL="${{ github.event.inputs.download_url }}"
          mkdir -p "$ARCH"
          FILENAME=$(basename "$URL")
          echo "--> Downloading $FILENAME into $ARCH/..."
          curl -sSL -o "${ARCH}/${FILENAME}" "$URL"
          ls -lh "${ARCH}/${FILENAME}"

      - name: Generate Packages and Packages.gz Index
        run: |
          ARCH="${{ github.event.inputs.arch }}"
          if [ -n "$ARCH" ]; then
            echo "--> Rebuilding index for architecture: $ARCH"
            python3 scripts/update_index.py "$ARCH"
          else
            echo "--> Auto-discovering and rebuilding indexes for all architectures"
            python3 scripts/update_index.py
          fi

      - name: Commit and Push Updated Feed Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Feed index is already up to date. Nothing to commit."
          else
            git commit -m "chore(feed): rebuild Packages and Packages.gz index [skip ci]"
            git push origin main
          fi
